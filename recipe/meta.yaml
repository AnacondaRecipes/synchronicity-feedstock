{% set name = "synchronicity" %}
{% set version = "0.12.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 94d96b1d85698e3056b96a793b8c0949af6584e4a7d877fabdeb5385efe230aa

build:
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - typing-extensions >=4.12.2

test:
  imports:
    - synchronicity
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/modal-labs/synchronicity
  summary: Export blocking and async library versions from a single async implementation
  description: |
    synchronicity lets you export a blocking (synchronous) and an asynchronous
    version of a library from a single asynchronous implementation. It wraps
    coroutines, generators, async context managers, and classes so that the same
    code can be consumed transparently from synchronous and asynchronous callers,
    while preserving a single event loop running on a dedicated thread.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://github.com/modal-labs/synchronicity
  dev_url: https://github.com/modal-labs/synchronicity

extra:
  recipe-maintainers:
    - thomasjpfan
    - devennavani
    - aksh-at
    - erikbern
    - freider
    - mwaskom
